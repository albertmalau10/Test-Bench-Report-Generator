info:
  name: POST /login
  type: http
  seq: 9

http:
  method: POST
  url: http://localhost:8080/login
  body:
    type: json
    data: |-
      {
        "username": "{{ username }}",
        "password": "{{ password }}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
